<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DA9FC"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0FBFF"/>
      <stop offset="45%" stop-color="#8FD9FF"/>
      <stop offset="100%" stop-color="#3DA9FC"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05070D"/>

  <!-- radiating lines -->
  <g stroke="url(#g)" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="9"/>
    <line x1="32" y1="32" x2="52" y2="21"/>
    <line x1="32" y1="32" x2="47" y2="50"/>
    <line x1="32" y1="32" x2="14" y2="46"/>
  </g>

  <!-- small end nodes -->
  <g fill="url(#g)">
    <circle cx="32" cy="9" r="3"/>
    <circle cx="52" cy="21" r="3"/>
    <circle cx="47" cy="50" r="3"/>
    <circle cx="14" cy="46" r="3"/>
  </g>

  <!-- central glowing node -->
  <circle cx="32" cy="32" r="10" fill="url(#core)"/>
</svg>
